  <!-- 内联 SVG favicon：霓虹六边形机器人徽标，避免 favicon.ico 404 -->

  <!-- 样式：base(变量/重置/背景) → layout(区块布局) → components(组件样式) → recruiter(求职速览+打印) -->
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/recruiter.css" />

  <!-- 二维码库（单文件 UMD，注册全局 qrcode；本地离线可用）
       defer：不阻塞首屏解析，main.js 是 module（天然 defer），执行顺序仍在它之前 -->
  <script src="js/vendor/qrcode.js" defer></script>
</head>
<body>
  <!-- 键盘用户跳过导航直达内容（Tab 第一个焦点） -->
  <a class="skip-link" href="#home">跳到主要内容</a>

  <!-- 科技感背景层：粒子 + 透视网格（canvas 由 fx.js 驱动） -->
  <canvas id="fx-bg" aria-hidden="true"></canvas>
  <div class="bg-vignette" aria-hidden="true"></div>

  <!-- 顶部滚动进度条 -->
  <div id="scroll-progress" aria-hidden="true"></div>

  <!-- 导航（由 components/nav.js 填充） -->
  <header id="nav" class="nav"></header>

  <!-- 悬浮控件：静音开关 + 分享二维码（fixed 悬浮，显眼位置） -->
  <div class="float-dock">
    <button id="sound-toggle" class="dock-btn" type="button" aria-label="音效开关" title="音效开关">
      <span class="dock-icon" id="sound-icon">🔇</span>
    </button>
    <button id="share-btn" class="dock-btn" type="button" aria-label="分享二维码" title="分享 / 二维码">
      <span class="dock-icon">▦</span>
    </button>
    <!-- 入口：成长轨迹贪吃蛇小游戏 -->
    <a class="dock-btn dock-link" href="snake.html" aria-label="玩成长轨迹贪吃蛇" title="成长轨迹 · 贪吃蛇">
      <span class="dock-icon">🎮</span>
    </a>
    <!-- 入口：生涯地牢冒险小游戏 -->
    <a class="dock-btn dock-link" href="adventure.html" aria-label="玩生涯地牢冒险游戏" title="生涯地牢 · 冒险">
      <span class="dock-icon">⚔️</span>
    </a>
  </div>

  <main id="app">
    <!-- 求职模式：给 HR 的一屏速览（components/recruiter.js 渲染，进入时替换常规视图） -->
    <section id="recruiter" class="recruiter" hidden></section>

    <!-- 各模块容器，内容由对应 component 渲染（hash 路由锚点即这些 id） -->
    <section id="home" class="section hero-section"></section>
    <section id="experience" class="section"></section>
    <section id="skills" class="section"></section>
    <section id="projects" class="section"></section>
    <section id="gallery" class="section"></section>
    <section id="contact" class="section"></section>
  </main>

  <footer id="footer" class="footer"></footer>

  <!-- 二维码弹窗（components/qrmodal.js 控制） -->
  <div id="qr-modal" class="modal" hidden>
    <div class="modal-mask" data-close></div>
    <div class="modal-panel">
      <button class="modal-close" type="button" data-close aria-label="关闭">✕</button>
      <h3 class="modal-title">扫码访问 / 分享</h3>
      <div id="qr-box" class="qr-box"></div>
      <p id="qr-url" class="qr-url"></p>
      <div class="qr-actions">
        <input id="qr-input" class="qr-input" type="url" placeholder="粘贴部署后的地址，重新生成二维码" />
        <button id="qr-regen" class="btn btn-ghost" type="button">生成</button>
        <button id="qr-save" class="btn btn-primary" type="button">设为默认地址</button>
      </div>
      <p class="qr-tip">提示：部署到 GitHub Pages / 艾可秀后，把最终地址粘贴到此处并「设为默认地址」，
        或直接修改 <code>js/config.js</code> 中的 <code>SITE.url</code>，二维码即永久指向新地址。</p>
    </div>
  </div>

  <!-- 项目视频播放弹层（components/projects.js 控制） -->
  <div id="video-modal" class="modal" hidden>
    <div class="modal-mask" data-close></div>
    <div class="modal-panel video-panel">
      <button class="modal-close" type="button" data-close aria-label="关闭">✕</button>
      <h3 id="video-title" class="modal-title"></h3>
      <video id="video-player" class="video-player" controls playsinline preload="metadata"></video>
    </div>
  </div>

  <!-- 入口模块（ES Module，组件装配见 js/main.js） -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
